# WHAT: ZMK build workflow for GitHub Actions.
# WHY: Pinning to @v0.3 ensures stable board definitions (nice_nano_v2) without breaking Zephyr changes.
# HOW: Uses official ZMK reusable workflow at release tag v0.3.
name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
